version: 2
updates:
  # Go modules: go.mod and go.sum. Minor and patch are grouped into one PR a week; majors
  # get their own, so they can be reviewed apart.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions, grouped. Dependabot keeps setup-just's commit pin and its version
  # comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
